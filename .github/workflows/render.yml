name: Render

run-name: Render ${{ inputs.variants }}

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Comma-separated variant ids, "pilot" for the pilot set, or "full" for the whole matrix'
        required: true
        default: pilot
      prefix:
        description: Optional key prefix inside the artifact bucket
        required: false
        default: ''
      fx:
        description: Optional JSON FX block (eq/reverb) applied to every selected variant
        required: false
        default: ''

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libfuse2 libasound2 libgtk-3-0 libnotify4 libsecret-1-0 libsndfile1

      - name: Install Audacity and the engine
        run: |
          bash setup.sh
          .venv/bin/pip install --disable-pip-version-check -r requirements-publish.txt

      - name: Select variants
        id: select
        env:
          VARIANTS: ${{ inputs.variants }}
          FX: ${{ inputs.fx }}
        run: |
          .venv/bin/python scripts/select_variants.py "$VARIANTS" --out /tmp/render-variants.yaml --fx "$FX" >> "$GITHUB_OUTPUT"

      - name: Probe the Audacity launch
        # A headless launch has many single points of failure and no display to
        # watch, so prove the binary starts before blaming the render.
        continue-on-error: true
        run: |
          echo "--- runner ---"
          cat /etc/os-release | head -2
          command -v xvfb-run xauth Xvfb || true
          echo "--- unresolved libraries ---"
          LD_LIBRARY_PATH=.audacity/squashfs-root/lib \
            ldd .audacity/squashfs-root/usr/bin/audacity 2>&1 | grep -i 'not found' || echo none
          echo "--- launch ---"
          NOISEGEN_AUDACITY_LOG=out/probe.log NOISEGEN_PIPE_TIMEOUT=120 \
            .venv/bin/python -c 'import time, orchestrator as o; t=time.monotonic(); p=o._launch(o._default_binary()); print("pipes opened in", round(time.monotonic()-t, 2), "s"); p.kill(); p.wait()' \
            || true
          cat out/probe.log
          # scripts/probe_audacity_launch.sh digs further (thread backtraces,
          # a screenshot of the virtual screen) if this ever regresses; it
          # needs gdb, x11-apps and imagemagick installed first.

      - name: Render
        env:
          NOISEGEN_AUDACITY_LOG: out/audacity.log
          NOISEGEN_PIPE_TIMEOUT: "120"
        run: |
          .venv/bin/python orchestrator.py \
            --variants-file /tmp/render-variants.yaml \
            --output-dir out \
            --aup3-serializer \
            --force

      - name: Diagnose a failed render
        if: failure()
        run: |
          echo '--- render_log.jsonl ---'
          cat out/render_log.jsonl || true
          echo '--- audacity.log ---'
          cat out/audacity.log || true
          echo '--- probe.log ---'
          cat out/probe.log || true

      - name: QA
        # A failing check is evidence to publish, not a reason to withhold the master.
        continue-on-error: true
        run: PYTHONPATH=qa .venv/bin/python qa/qa_harness.py out --report out/qa_report.html --json out/qa_results.json

      - name: Publish to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'noise-labs' }}
          R2_PREFIX: ${{ inputs.prefix }}
        run: .venv/bin/python scripts/publish_artifacts.py out

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            out/qa_report.html
            out/qa_results.json
            out/render_log.jsonl
            out/audacity.log
            out/probe.log
            out/probe-audacity.log
            out/screen.png
          if-no-files-found: ignore
