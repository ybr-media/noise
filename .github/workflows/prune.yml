name: Prune

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Optional key prefix inside the artifact bucket
        required: false
        default: ''
      dry_run:
        description: Report what would be deleted without deleting
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install --disable-pip-version-check -r requirements-publish.txt
      - name: Prune the bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'noise-labs' }}
          R2_PREFIX: ${{ inputs.prefix || '' }}
        run: .venv/bin/python scripts/prune_bucket.py ${{ inputs.dry_run && '--dry-run' || '' }}
